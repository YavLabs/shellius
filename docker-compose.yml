# Bundled infra (postgres, redis, minio) runs under Compose profiles so you can
# "bring your own" managed Postgres / Redis / S3 / Azure and drop the container.
# COMPOSE_PROFILES in .env controls which bundled services start (default:
# postgres,redis,minio). To use an external service: remove its profile from
# COMPOSE_PROFILES and set the matching env (DATABASE_URL / REDIS_URL /
# storage settings). depends_on uses `required: false` so the backend still
# starts when a bundled service is absent.
services:
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shellius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shellius_dev}
      POSTGRES_DB: ${POSTGRES_DB:-shellius}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shellius}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped
    networks:
      - default

  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: http://localhost/minio
    volumes:
      - minio_data:/data
    ports:
      - "9002:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      # Defaults point at the bundled containers; override DATABASE_URL /
      # REDIS_URL in .env to use an external Postgres / Redis.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-shellius}:${POSTGRES_PASSWORD:-shellius_dev}@postgres:5432/${POSTGRES_DB:-shellius}?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      guacd:
        condition: service_started
      minio:
        condition: service_healthy
        required: false

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  minio_data:
