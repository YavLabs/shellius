services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shellius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shellius_dev}
      POSTGRES_DB: ${POSTGRES_DB:-shellius}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shellius}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped
    networks:
      - default

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shellius}:${POSTGRES_PASSWORD:-shellius_dev}@postgres:5432/${POSTGRES_DB:-shellius}?schema=public
      REDIS_URL: redis://redis:6379
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      guacd:
        condition: service_started
    volumes:
      - recordings_data:/data/recordings

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  recordings_data:
