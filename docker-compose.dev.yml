services:
  guacd:
    # Custom guacd build with H.264 (OpenH264) enabled. The official
    # guacamole/guacd image builds FreeRDP with -DWITH_OPENH264=OFF, so it
    # cannot decode the RDP Graphics Pipeline that Windows 10/11 and Server
    # 2016+ default to: the desktop renders fully BLACK while the cursor
    # still moves. Only docker-compose.deploy.yml used this build until 2.1,
    # so RDP was broken in every other deployment, including all-in-one.
    # See docker/Dockerfile.guacd. First build takes a few minutes; it is
    # cached after that.
    build:
      context: .
      dockerfile: docker/Dockerfile.guacd
    image: shellius-guacd:h264
    restart: unless-stopped
    networks:
      - default

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shellius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shellius_dev}
      POSTGRES_DB: ${POSTGRES_DB:-shellius}
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shellius}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
