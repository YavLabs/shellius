server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are content-addressed — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NEVER be cached, otherwise after a redeploy the browser
    # keeps an old index.html that references asset hashes which no longer exist
    # (404 → the app's JS fails to load → dead UI / broken search & sort).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
}
