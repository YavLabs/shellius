user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream shellius_backend  { server shellius-api:3001; }
    upstream shellius_frontend { server shellius-web:80; }

    server {
        listen 80 default_server;
        server_name _;

        # MinIO Console
        location = /minio {
            return 301 $scheme://$http_host/minio/;
        }

        location /minio/ {
            proxy_pass http://minio:9001/;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy     true;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
        }

        # MinIO S3 API (for presigned playback URLs)
        location /s3/ {
            rewrite ^/s3(/.*) $1 break;
            proxy_pass http://minio:9000;
            proxy_set_header Host              $host;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            client_max_body_size 100m;
        }

        # Backend API + WebSocket
        location /api/ {
            proxy_pass http://shellius_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # Frontend SPA
        location / {
            proxy_pass http://shellius_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
