# nginx for the all-in-one image (docker/Dockerfile.allinone).
#
# One process serves the built SPA straight from disk and proxies /api
# (REST + the terminal WebSocket) to the Node API on 127.0.0.1:3001 in the
# same container. Runs as the unprivileged `app` user, so it listens on 8080
# and keeps its pid/temp files under /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    # Access log without the query string: terminal WebSocket tickets,
    # install links, invite/reset links and OAuth callbacks carry credentials
    # in query parameters (see docs/DEPLOYMENT.md, "Access logs").
    log_format shellius_redacted '$remote_addr - $remote_user [$time_local] '
                                 '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                 '"$http_referer" "$http_user_agent" $request_time';
    access_log /dev/stdout shellius_redacted;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 100m;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Keep the scheme an outer TLS proxy (Traefik/Coolify/Caddy) reported;
    # fall back to our own when the container is exposed directly.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # WebSocket upgrades pass through; plain requests keep the upstream
    # keepalive connection (empty Connection header, not "close").
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream shellius_api {
        server 127.0.0.1:3001;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/shellius/web;
        index index.html;

        # API + terminal WebSocket (/api/terminal/ssh, /api/terminal/rdp)
        location /api/ {
            proxy_pass http://shellius_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # Hashed build assets are content-addressed: cache forever.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html must never be cached, or a redeploy leaves browsers
        # pointing at asset hashes that no longer exist.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }

        # SPA routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
