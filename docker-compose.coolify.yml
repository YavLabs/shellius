# =============================================================================
# Shellius — Coolify "Docker Compose" resource
#
# Differences from docker-compose.prod.yml (which targets a Traefik instance
# you run yourself, on a shared `homelab` network):
#   - No host port bindings. Coolify's own Traefik proxy talks to containers
#     over the internal Compose network, so publishing ports on the host is
#     unnecessary and can collide with other resources on the same server.
#   - No hand-written Traefik labels / external network. Coolify manages its
#     proxy itself; point it at the `nginx` service and port 80 from the
#     Coolify UI ("Domains" on that service), or set SERVICE_FQDN_NGINX_80
#     below and let Coolify wire the label for you.
#   - Named volumes only (Coolify persists these across redeploys the same
#     way it does for any Compose resource).
#
# Usage in Coolify:
#   1. New Resource -> Docker Compose -> point at this file (or paste it in).
#   2. Set every variable below as an Environment Variable on the resource
#      (mark secrets as "is secret" — see docs/DEPLOYMENT.md for the full list
#      and `openssl rand -hex 32` commands).
#   3. In the resource's service list, open "nginx" -> Domains, and set your
#      hostname (e.g. shellius.example.com). Coolify issues the TLS cert.
#   4. Deploy. First boot runs `prisma migrate deploy` + the idempotent seed
#      automatically (see docker/entrypoint-backend.sh) — no extra step.
# =============================================================================

services:

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/nginx.conf:ro
    # Optional: uncomment to have Coolify auto-generate the domain + Traefik
    # label instead of setting the domain by hand in the UI.
    # environment:
    #   SERVICE_FQDN_NGINX_80: ${SERVICE_FQDN_NGINX_80:-}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  backend:
    image: yavadmin/shellius-backend:${SHELLIUS_VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      TRAEFIK_HOST: ${TRAEFIK_HOST}
      PUBLIC_URL: https://${TRAEFIK_HOST}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-postgres,redis,minio}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-8h}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      SERVER_ENCRYPTION_KEY: ${SERVER_ENCRYPTION_KEY}
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET}
      SSH_TARGET_ALLOW_LOOPBACK: ${SSH_TARGET_ALLOW_LOOPBACK:-false}
      METRICS_TOKEN: ${METRICS_TOKEN}
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_RECORDINGS_BUCKET: ${MINIO_RECORDINGS_BUCKET:-shellius-recordings}
      SEED_ORG_NAME: ${SEED_ORG_NAME}
      SEED_ORG_SLUG: ${SEED_ORG_SLUG}
      SEED_ORG_DOMAIN: ${SEED_ORG_DOMAIN}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      guacd:
        condition: service_started
      minio:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: yavadmin/shellius-frontend:${SHELLIUS_VERSION:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  minio_data:
