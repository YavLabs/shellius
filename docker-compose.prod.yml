services:

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    labels:
      # --- Traefik reverse proxy (optional — ignored when Traefik is not running) ---
      - "traefik.enable=true"
      - "traefik.docker.network=homelab"

      # HTTP router — plain HTTP, TLS termination handled by Cloudflare upstream
      - "traefik.http.routers.shellius.entrypoints=http"
      - "traefik.http.routers.shellius.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.shellius.service=shellius"
      - "traefik.http.routers.shellius.priority=10"

      # Service — nginx listens on port 80 inside Docker
      - "traefik.http.services.shellius.loadbalancer.server.port=80"
      - "traefik.http.services.shellius.loadbalancer.passHostHeader=true"
    networks:
      - internal
      - homelab

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped
    networks:
      - internal

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    env_file: .env.prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: https://${TRAEFIK_HOST}/minio
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - internal
      - homelab

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: shellius-api
    restart: unless-stopped
    env_file: .env.prod
    environment:
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      guacd:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      internal:
        aliases:
          - shellius-api
      public: {}

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: shellius-web
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - shellius-web

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
  homelab:
    external: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
