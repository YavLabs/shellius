# =============================================================================
# Shellius — Production Compose
#
# Uses pre-built images from Docker Hub (yavadmin/shellius-backend and
# yavadmin/shellius-frontend). These are built and pushed by the GitHub Actions
# workflow at .github/workflows/docker-build-push.yml.
#
# Image version is controlled by SHELLIUS_VERSION (default: latest).
# Pin to a specific release: SHELLIUS_VERSION=1.2.3 docker compose ... up -d
#
# Required env file: .env.prod  (see .env.prod.example)
# =============================================================================

services:

  # ── Reverse proxy (Traefik-aware) ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: shellius-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab"
      - "traefik.http.routers.shellius.entrypoints=http"
      - "traefik.http.routers.shellius.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.shellius.service=shellius"
      - "traefik.http.routers.shellius.priority=10"
      - "traefik.http.services.shellius.loadbalancer.server.port=80"
      - "traefik.http.services.shellius.loadbalancer.passHostHeader=true"
    networks:
      - internal
      - homelab

  # ── PostgreSQL (bundled; omit profile + set DATABASE_URL for managed PG) ────
  postgres:
    image: postgres:16-alpine
    container_name: shellius-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  # ── Redis (bundled; omit profile + set REDIS_URL for managed Redis) ─────────
  redis:
    image: redis:7-alpine
    container_name: shellius-redis
    profiles: ["redis"]
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  # ── Guacamole daemon (RDP gateway) ────────────────────────────────────────
  guacd:
    image: guacamole/guacd:1.5.5
    container_name: shellius-guacd
    restart: unless-stopped
    networks:
      - internal

  # ── MinIO (bundled; omit profile + configure S3/Azure for external storage) ─
  minio:
    image: minio/minio:latest
    container_name: shellius-minio
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    restart: unless-stopped
    env_file: .env.prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: https://${TRAEFIK_HOST}/minio
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - internal

  # ── Backend API ───────────────────────────────────────────────────────────
  # Built by CI and pushed to Docker Hub. No local build context here.
  backend:
    image: yavadmin/shellius-backend:${SHELLIUS_VERSION:-latest}
    container_name: shellius-api
    restart: unless-stopped
    env_file: .env.prod
    environment:
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      guacd:
        condition: service_started
      minio:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      internal:
        aliases:
          - shellius-api

  # ── Frontend SPA (nginx-served) ───────────────────────────────────────────
  # Built by CI and pushed to Docker Hub. No local build context here.
  frontend:
    image: yavadmin/shellius-frontend:${SHELLIUS_VERSION:-latest}
    container_name: shellius-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      internal:
        aliases:
          - shellius-web

networks:
  internal:
    driver: bridge
  homelab:
    external: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
